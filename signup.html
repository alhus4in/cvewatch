<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>CVEWatch - Sign up</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>

<header>
    <img src="logo.svg" alt="CVEWatch logo" width="200" height="50" usemap="#logomap">
    <map name="logomap">
        <area shape="rect" coords="0,0,200,50" href="about.html" alt="About us">
    </map>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="signup.html" class="active">Sign up</a></li>
        <li><a href="about.html">About us</a></li>
    </ul>
</header>

<div class="container narrow">

    <h1>Sign up</h1>

    <section class="card">
        <form action="login.html" method="post" novalidate onsubmit="return validateSignup()" onreset="clearErrors()">
            <label for="fullname">Full name</label>
            <input type="text" id="fullname" name="fullname" onblur="checkName()">
            <span class="error" id="nameError"></span>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" onblur="checkEmail()">
            <span class="error" id="emailError"></span>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" onblur="checkPassword(); showStrength()">
            <span class="error" id="passwordError"></span>
            <span id="strength"></span>
            <button type="button" class="btn small" id="showBtn" onclick="togglePassword('password', 'showBtn')">Show password</button>

            <label for="confirm">Confirm password</label>
            <input type="password" id="confirm" name="confirm" onblur="checkConfirm()">
            <span class="error" id="confirmError"></span>

            <label for="software">Software you use most</label>
            <input type="text" id="software" name="software" list="softwarelist">
            <datalist id="softwarelist">
                <option value="Windows">
                <option value="Linux">
                <option value="Apache">
                <option value="OpenSSL">
                <option value="Java">
            </datalist>

            <label>I am a:</label>
            <input type="radio" id="student" name="role" value="student" checked>
            <label for="student" style="display: inline;">Student</label>
            <input type="radio" id="admin" name="role" value="admin">
            <label for="admin" style="display: inline;">System admin</label>

            <p><input type="checkbox" id="alerts" name="alerts">
            <label for="alerts" style="display: inline;">Email me about new Critical CVEs</label></p>

            <button type="submit" class="btn">Create account</button>
            <button type="reset" class="btn">Clear form</button>
        </form>
    </section>

</div>

<footer>
    <p>CVEWatch | Alhusain Alsharif | 2340982 | CPIS 358</p>
</footer>

</body>
</html>
