<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CVEWatch - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <img src="logo.svg" alt="CVEWatch logo" width="200" height="50" usemap="#logomap">
    <map name="logomap">
        <area shape="rect" coords="0,0,200,50" href="about.html" alt="About us">
    </map>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="signup.html">Sign up</a></li>
        <li><a href="about.html">About us</a></li>
    </ul>
</header>

<div class="container">

    <h1>Login</h1>

    <section class="card">
        <form action="index.html" method="post">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <p><input type="checkbox" id="remember" name="remember">
            <label for="remember" style="display: inline;">Remember me</label></p>

            <button type="submit" class="btn">Log in</button>
        </form>
        <p>No account yet? <a href="signup.html">Sign up here</a>.</p>
    </section>

</div>

<footer>
    <p>CVEWatch | Alhusain Alsharif | 2340982 | CPIS 358</p>
</footer>

</body>
</html>
